<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon TCG · 30th Celebration · Bienvenido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#e9ecf3;--panel:#fff;--ink:#16203a;--muted:#5d6785;--line:#d3d8e6;--cobalt:#2f4bff;--gold:#e3a700;
        --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#101427;--panel:#1a2038;--ink:#eef0fa;--muted:#9aa4c7;--line:#2c3457;--cobalt:#7d92ff;--gold:#ffc933}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.5;display:grid;place-items:center;padding:32px 20px}
  main{max-width:980px;width:100%;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
  .tag{display:inline-block;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;line-height:1.02;letter-spacing:-.03em;margin:0 0 16px}
  h1 span{background:linear-gradient(90deg,var(--cobalt),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  p.lead{font-size:1.1rem;color:var(--muted);margin:0 0 24px;max-width:46ch}
  .cta{display:inline-block;background:var(--cobalt);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:10px;font-size:1.05rem;transition:transform .15s}
  .cta:hover{transform:translateY(-2px)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding:0;list-style:none}
  .stats li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem;color:var(--muted)}
  .stats b{display:block;font-size:1.3rem;color:var(--ink)}
  .fan{position:relative;height:380px}
  .fan img{position:absolute;width:48%;top:50%;left:50%;border-radius:10px;box-shadow:0 14px 30px rgba(10,15,40,.35);transform-origin:50% 120%}
  .fan img:nth-child(1){transform:translate(-50%,-50%) rotate(-14deg) translateX(-55%)}
  .fan img:nth-child(2){transform:translate(-50%,-55%) rotate(0deg);z-index:2}
  .fan img:nth-child(3){transform:translate(-50%,-50%) rotate(14deg) translateX(55%)}
  @media (max-width:760px){main{grid-template-columns:1fr;gap:10px}.fan{height:300px;order:-1}}
  @media (prefers-reduced-motion:reduce){.cta{transition:none}}
  .ghost{margin-left:10px;background:transparent;color:var(--ink);border:1px solid var(--line);font:inherit;font-weight:600;padding:13px 20px;border-radius:10px;cursor:pointer}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:24px;width:min(340px,92vw);font-family:var(--f)}
  dialog::backdrop{background:rgba(10,15,40,.55)}
  dialog h2{margin:0 0 12px;font-size:1.2rem}
  dialog input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  dialog .row{display:flex;gap:8px;justify-content:flex-end}
  dialog button{font:inherit;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:inherit}
  dialog button.go{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  #err{color:#d64545;font-size:.85rem;min-height:1.2em;margin:0 0 6px}
</style>
</head>
<body>
<main>
  <section>
    <span class="tag">30 años · 1996–2026</span>
    <h1>Pokémon TCG <span>30th Celebration</span></h1>
    <p class="lead">Lleva el control de tu colección: qué cartas ya tienes, cuáles te faltan y cuánto llevas completado, con imagen de cada una.</p>
    <a class="cta" href="coleccion.html">Ver la colección →</a><button class="ghost" id="adm">Acceso admin</button>
    <ul class="stats" aria-label="Contenido del set">
      <li><b>128</b>set principal</li>
      <li><b>33</b>secretas</li>
      <li><b>30</b>Classic Collection</li>
      <li><b>8</b>energías</li>
    </ul>
  </section>
  <div class="fan" aria-hidden="true">
    <img alt="" src="https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/30C/30C_157_R_EN_SM.png" onerror="this.remove()">
    <img alt="" src="https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/30C/30C_149_R_EN_SM.png" onerror="this.remove()">
    <img alt="" src="https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/30C/30C_158_R_EN_SM.png" onerror="this.remove()">
  </div>
</main>
<dialog id="dlg">
  <form id="f" method="dialog">
    <h2>Acceso de administrador</h2>
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required>
    <p id="err" role="alert"></p>
    <div class="row"><button type="button" id="cx">Cancelar</button><button class="go" id="ok">Entrar</button></div>
  </form>
</dialog>
<script>
const API = "https://script.google.com/macros/s/AKfycbxsOMIMUIm61qxNokDuDnv-TqQWAG6IspHZCgPcKRIXIUDWaXzMsK__S7iUxGWZX7Pz/exec";   // misma URL que en coleccion.html
const $ = id => document.getElementById(id);
$("adm").onclick = () => { $("err").textContent = ""; $("dlg").showModal(); $("pw").focus(); };
$("cx").onclick = () => $("dlg").close();
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (API.startsWith("PEGA_")){ $("err").textContent = "Falta configurar la URL de Apps Script."; return; }
  $("ok").disabled = true; $("err").textContent = "Verificando…";
  try{
    const res = await fetch(API, {method:"POST", body: JSON.stringify({action:"login", password:$("pw").value})});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "Error");
    sessionStorage.setItem("tcg30c-admin", $("pw").value);
    location.href = "coleccion.html";
  }catch(e){ $("err").textContent = e.message; }
  $("ok").disabled = false;
});
</script>
</body>
</html>
