<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi colección · Pokémon TCG 30th Celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9ecf3; --panel:#ffffff; --ink:#16203a; --muted:#5d6785; --line:#d3d8e6;
    --cobalt:#2f4bff; --gold:#e3a700; --ok:#1a8a4f;
    --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#101427;--panel:#1a2038;--ink:#eef0fa;--muted:#9aa4c7;--line:#2c3457;--cobalt:#7d92ff;--gold:#ffc933;--ok:#4fd08a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.4}
  header{padding:28px 20px 18px;max-width:1200px;margin:0 auto}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:0;z-index:5;margin-bottom:18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  button,select,input{font:inherit;color:inherit}
  .tab{border:1px solid var(--line);background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  input[type=search],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
  input[type=search]{flex:1 1 160px}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .prog{flex:1 1 100%;display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
  .track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--cobalt),var(--gold));transition:width .4s}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
  .card .img{aspect-ratio:245/342;border-radius:6px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.8rem;text-align:center}
  .card img{width:100%;height:100%;object-fit:contain;filter:grayscale(1);opacity:.45;transition:filter .2s,opacity .2s}
  .card.own{border-color:var(--gold)}
  .card.own img{filter:none;opacity:1}
  .card b{font-size:.88rem;font-weight:600;line-height:1.2}
  .card small{color:var(--muted);font-size:.76rem}
  .tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
  .card.own .tag{border-color:var(--gold);color:var(--ink)}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.85rem;align-items:center}
  footer button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
  <p style="margin:0 0 8px"><a href="index.html" style="color:var(--cobalt);text-decoration:none">← Inicio</a></p>
  <h1>Pokémon TCG · 30th Celebration</h1>
  <p>Tu colección, leída en vivo desde tu Google Sheet.</p>
</header>
<div class="wrap">
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <input type="search" id="q" placeholder="Buscar por nombre o número" aria-label="Buscar">
    <select id="own" aria-label="Filtrar por estado">
      <option value="all">Todas</option><option value="yes">Las tengo</option><option value="no">Me faltan</option>
    </select>
    <select id="rar" aria-label="Filtrar por rareza"><option value="">Todas las rarezas</option></select>
    <div class="prog"><span id="ptxt">Cargando…</span><div class="track"><div class="fill" id="pfill"></div></div></div>
  </div>
  <div id="view"><div class="msg">Cargando el Excel…</div></div>
  <footer>
    <span id="foot"></span>
    <button id="out" hidden>Cerrar sesión de admin</button>
  </footer>
</div>
<script>
const SHEET_ID = "1H-xJutkK2lumjkKChyJj5Q18EW7wW-Ji6boq6GUlbHQ";   // ID de tu Google Sheet
const SHEETS = ["Set principal", "Secretas", "Classic Collection", "Energías"];
// Imágenes desde tu carpeta pública de Google Drive (images_30Aniver).
const DRIVE_FOLDER_ID = "1THRuNMTPR4wdwugrM1aZrFsk9_urnuFf";
const DRIVE_API_KEY = "AIzaSyB6Fzuf9tb_YeJJbNcPBJAc0hEtP_oOvWs";   // clave de API de Google (restringida a Drive API y a tu dominio)
let driveMap = {};          // código de carta -> ID del archivo en Drive
// Respaldo si una imagen no está en Drive:
const IMG = c => `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/30C/30C_${c}_R_EN_SM.png`;
const API = "https://script.google.com/macros/s/AKfycbxsOMIMUIm61qxNokDuDnv-TqQWAG6IspHZCgPcKRIXIUDWaXzMsK__S7iUxGWZX7Pz/exec";   // URL de la aplicación web (termina en /exec)
const PW = sessionStorage.getItem("tcg30c-admin") || "";
const ADMIN = !!PW;
let data = {}, sheet = "";
const $ = id => document.getElementById(id);

function csv(t){
  const out=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){
    const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===","){ row.push(f); f=""; }
    else if (c==="\n"){ row.push(f); out.push(row); row=[]; f=""; }
    else if (c!=="\r") f+=c;
  }
  if (f!==""||row.length){ row.push(f); out.push(row); }
  return out;
}
function imgFor(sheetName, r, i){
  if (sheetName==="Classic Collection") return "CC"+(i+1);
  const n=String(r["N.º"]||"");
  if (n.endsWith("/128")) return n.split("/")[0];
  if (n.endsWith("/RGB")) return n.split("/")[0];
  return "";
}
function parseSheet(name, text){
  const t = csv(text), heads = t[0] || [];
  return t.slice(1).map((cells,i)=>{
    const o={}; heads.forEach((h,c)=>o[h]=cells[c]||"");
    o._img=imgFor(name,o,i); return o;
  }).filter(o=>Object.values(o).some(v=>v!==""));
}
const nameOf = r => r["Nombre"] || r["Carta"] || "";
const numOf  = r => r["N.º"] || r["N.º original"] || "";
const keyOf  = (s, r) => s + "|" + numOf(r) + "|" + nameOf(r);
const isOwn  = (s, r) => r["¿La tengo?"] === "Sí";

function codeFromName(name){
  let n = name.replace(/\.[^.]+$/, "").toUpperCase().replace(/^30C[_\- ]?/, "");
  let m = n.match(/^CC[_\- ]?0*(\d+)/) || n.match(/(?:^|[_\- ])CC[_\- ]?0*(\d+)/);
  if (m) return "CC" + m[1];
  m = n.match(/^([RGB])(?:[_\- ]|$)/);
  if (m) return m[1];
  m = n.match(/(?:^|[^0-9])(\d{1,3})(?:[^0-9]|$)/);
  return m ? String(m[1]).padStart(3, "0") : null;
}
async function listDrive(folderId, depth){
  let token = "", out = [];
  do{
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&key=${DRIVE_API_KEY}` + (token ? "&pageToken=" + token : "");
    const res = await fetch(url);
    if (!res.ok) throw new Error("Drive API " + res.status);
    const j = await res.json(); token = j.nextPageToken || "";
    for (const f of j.files){
      if (f.mimeType === "application/vnd.google-apps.folder"){ if (depth > 0) out = out.concat(await listDrive(f.id, depth - 1)); }
      else if (/^image\//.test(f.mimeType)) out.push(f);
    }
  } while (token);
  return out;
}
async function loadDrive(){
  if (!DRIVE_API_KEY) return;
  try{
    const files = await listDrive(DRIVE_FOLDER_ID, 2), miss = [];
    files.forEach(f => { const c = codeFromName(f.name); if (c) driveMap[c] = f.id; else miss.push(f.name); });
    console.info("Drive: " + Object.keys(driveMap).length + " imágenes reconocidas; sin reconocer:", miss);
  }catch(e){ console.warn("No pude leer la carpeta de Drive; uso Limitless como respaldo.", e); }
}
async function load(){
  try{
    for (const n of SHEETS){
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}&_=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Google respondió " + res.status + " al pedir la hoja «" + n + "».");
      data[n] = parseSheet(n, await res.text());
    }
    await loadDrive();
    sheet = SHEETS[0];
    buildTabs(); render();
  }catch(e){
    $("view").innerHTML = '<div class="msg"><b>No pude leer tu Google Sheet.</b><br>' + e.message +
      '<br>Para que funcione, el archivo debe ser una hoja de cálculo de Google (no un .xlsx subido a Drive) y estar compartido como «Cualquier persona con el enlace: Lector». Abre la página desde GitHub Pages, no con doble clic.</div>';
    $("ptxt").textContent = "Sin datos";
  }
}
function buildTabs(){
  $("tabs").innerHTML = "";
  Object.keys(data).forEach(n => {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.textContent = n;
    b.onclick = () => { sheet = n; fillRarity(); render(); };
    $("tabs").appendChild(b);
  });
  fillRarity();
}
function fillRarity(){
  const set = [...new Set(data[sheet].map(r => r["Rareza"]).filter(Boolean))];
  $("rar").innerHTML = '<option value="">Todas las rarezas</option>' + set.map(x => `<option>${x}</option>`).join("");
  $("rar").style.display = set.length ? "" : "none";
}
function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.textContent === sheet));
  const rows = data[sheet], q = $("q").value.trim().toLowerCase(), f = $("own").value, rar = $("rar").value;
  const own = rows.filter(r => isOwn(sheet, r)).length;
  $("ptxt").textContent = `${sheet}: ${own} de ${rows.length} (${rows.length ? Math.round(own/rows.length*100) : 0}%)`;
  $("pfill").style.width = (rows.length ? own/rows.length*100 : 0) + "%";
  const list = rows.filter(r => {
    const o = isOwn(sheet, r);
    return (f === "all" || (f === "yes") === o) && (!rar || r["Rareza"] === rar) &&
      (!q || (nameOf(r) + " " + numOf(r)).toLowerCase().includes(q));
  });
  const g = document.createElement("div"); g.className = "grid";
  if (!list.length) g.innerHTML = '<div class="msg">Ninguna carta coincide con estos filtros.</div>';
  list.forEach(r => {
    const o = isOwn(sheet, r), b = document.createElement("button");
    b.className = "card" + (o ? " own" : ""); b.setAttribute("aria-pressed", o);
    b.innerHTML = `<div class="img">${r._img ? `<img loading="lazy" alt="" src="${driveMap[r._img] ? `https://drive.google.com/thumbnail?id=${driveMap[r._img]}&sz=w400` : IMG(r._img)}" data-fb="${IMG(r._img)}" onerror="if(this.dataset.fb&&!this.dataset.t){this.dataset.t=1;this.src=this.dataset.fb}else{this.replaceWith('Sin imagen')}">` : "Sin imagen"}</div>
      <b>${nameOf(r)}</b><small>${numOf(r)}</small>${r["Rareza"] ? `<span class="tag">${r["Rareza"]}</span>` : ""}`;
    b.style.cursor = ADMIN ? "pointer" : "default"; b.onclick = () => toggle(r);
    g.appendChild(b);
  });
  $("view").replaceChildren(g);
}
["q","own","rar"].forEach(id => $(id).addEventListener("input", render));
let busy = false;
async function toggle(r){
  if (!ADMIN || busy) return;
  busy = true;
  const old = r["¿La tengo?"], val = old === "Sí" ? "No" : "Sí";
  r["¿La tengo?"] = val; render();
  try{
    const res = await fetch(API, {method:"POST", body: JSON.stringify({action:"set", password:PW, sheet, num:numOf(r), name:nameOf(r), value:val})});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "Error desconocido");
  }catch(e){
    r["¿La tengo?"] = old; render();
    alert("No se pudo guardar: " + e.message);
  }
  busy = false;
}
$("foot").textContent = ADMIN
  ? "Modo admin: toca una carta para marcarla o desmarcarla. Los cambios se guardan en tu Google Sheet."
  : "Vista de solo lectura. Si eres el administrador, inicia sesión desde la página de inicio.";
if (ADMIN){ $("out").hidden = false; $("out").onclick = () => { sessionStorage.removeItem("tcg30c-admin"); location.href = "index.html"; }; }
load();
</script>
</body>
</html>
