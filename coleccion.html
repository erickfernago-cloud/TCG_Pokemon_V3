<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi colección · Pokémon TCG 30th Celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a16; --panel:#1a2038; --ink:#eef0fa; --muted:#9aa4c7; --line:#2c3457;
    --cobalt:#7d92ff; --gold:#ffc933; --ok:#4fd08a; color-scheme:dark;
    --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#070a16;--panel:#1a2038;--ink:#eef0fa;--muted:#9aa4c7;--line:#2c3457;--cobalt:#7d92ff;--gold:#ffc933;--ok:#4fd08a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.4}
  header{padding:28px 20px 18px;max-width:1200px;margin:0 auto}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:0;z-index:5;margin-bottom:18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  button,select,input{font:inherit;color:inherit}
  .tab{border:1px solid var(--line);background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  input[type=search],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
  input[type=search]{flex:1 1 160px}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .prog{flex:1 1 100%;display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
  .track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--cobalt),var(--gold));transition:width .4s}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
  .card .img{position:relative;aspect-ratio:245/342;border-radius:6px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.8rem;text-align:center}
  .card img{width:100%;height:100%;object-fit:contain;filter:grayscale(1);opacity:.45;transition:filter .2s,opacity .2s}
  .card.own{border-color:var(--gold)}
  .card.own img{filter:none;opacity:1}
  .card b{font-size:.88rem;font-weight:600;line-height:1.2}
  .card small{color:var(--muted);font-size:.76rem}
  .tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
  .card.own .tag{border-color:var(--gold);color:var(--ink)}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.85rem;align-items:center}
  footer button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer}
  .card.saving{pointer-events:none}
  .card.saving .img::before{content:"";position:absolute;inset:0;background:rgba(10,15,40,.45);z-index:1}
  .card.saving .img::after{content:"";position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;z-index:2;
    border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.card.saving .img::after{animation-duration:2.5s}}
  .role{font-size:.8rem;font-weight:600;padding:3px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .role.admin{background:var(--gold);border-color:var(--gold);color:#16203a}
  .card{position:relative}
  .card.pick{border-color:var(--cobalt)}
  .card.pick::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:.85rem;font-weight:800;display:grid;place-items:center;z-index:3}
  footer button[hidden]{display:none}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
  .top .home{color:var(--cobalt);text-decoration:none}
  .session{display:flex;align-items:center;gap:8px;margin-left:auto}
  .logout{border:1px solid var(--line);background:var(--panel);padding:4px 12px;border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:600}
  .logout:hover{border-color:var(--cobalt)}
  .logout[hidden]{display:none}
  .actions{flex:1 1 100%;display:flex;gap:8px;flex-wrap:wrap}
  .act{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}
  .act:hover{border-color:var(--cobalt)}
  .act[hidden]{display:none}
  .bar{flex-direction:column;align-items:stretch;gap:12px}
  .grp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .g2{padding-top:12px;border-top:1px solid var(--line)}
  .g1 input[type=search]{flex:1 1 200px}
  header p,.msg,#foot{text-align:justify}
  .bar{max-height:calc(100vh - 16px);overflow-y:auto;top:8px;gap:0}
  .acc{border-bottom:1px solid var(--line)}
  .acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;padding:10px 4px;font-weight:600;font-size:.95rem}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
  .acc[open] summary::after{transform:rotate(180deg)}
  .accbody{padding:2px 4px 12px}
  .frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .frow .tabs{display:contents}
  .accbody input[type=search]{width:100%}
  .g2{border-top:0;padding-top:12px}
  @media (prefers-reduced-motion:reduce){.acc summary::after{transition:none}}
  #tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--cobalt);padding:10px 16px}
  #tray .tr{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;max-width:1200px;margin:0 auto}
  #tray button{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;color:inherit;font:inherit}
  #go{background:var(--cobalt)!important;border-color:var(--cobalt)!important;color:#fff}
  #trerr{color:#d64545;font-weight:600;margin:6px auto 0;max-width:1200px;min-height:1.1em;font-size:.9rem}
  #tray[hidden]{display:none}
  #trmin{display:block;margin:0 auto 6px;font-weight:600}
  #tray.min{padding-top:6px;padding-bottom:6px}
  #tray.min #trmin{margin-bottom:0}
  #tray.min .trbody{display:none}
  #foot:empty{display:none}
  #top{position:fixed;right:16px;bottom:calc(var(--trayh,0px) + 16px);z-index:30;width:46px;height:46px;border-radius:50%;border:2px solid var(--cobalt);background:var(--panel);color:var(--ink);font-size:1.3rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  #top[hidden]{display:none}
  body{padding-bottom:110px}
  #foot{margin:0;padding-top:8px;color:var(--muted);font-size:.85rem}
  #tray .tr{flex-wrap:nowrap;justify-content:space-between;gap:16px}
  #tray .acts{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
  #tray .btns{display:flex;gap:8px;margin-left:auto}
  #tray label{cursor:pointer}
  @media (max-width:700px){
    #tray .tr{flex-direction:column;align-items:flex-start;gap:12px}
    #tray .acts{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px}
    #tray .btns{display:flex;margin-left:0;gap:10px}
    #tray .btns button{padding:9px 16px}
  }
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:22px;width:min(420px,94vw);font-family:var(--f)}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog h2{margin:0 0 10px;font-size:1.2rem}
  dialog label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:8px}
  dialog input,dialog textarea{display:block;width:100%;margin-top:3px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
  dialog .hint{font-size:.85rem;color:var(--muted);margin:4px 0 8px}
  dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  dialog button{font:inherit;color:inherit;border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:8px;cursor:pointer}
  dialog button.go{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  #rerr{color:#d64545;min-height:1.1em;font-size:.88rem;margin:0}
</style>
</head>
<body>
<header>
  <div class="top"><a href="index.html" class="home">← Inicio</a><div class="session"><span id="role" class="role"></span><button id="out" class="logout" hidden>Cerrar sesión</button></div></div>
  <h1>Pokémon TCG · 30th Celebration</h1>
</header>
<div class="wrap">
  <div class="bar">
    <details class="acc" open>
      <summary>Filtros</summary>
      <div class="accbody frow"><div class="tabs" id="tabs" role="tablist"></div><select id="rar" aria-label="Filtrar por rareza"><option value="">Todas las rarezas</option></select><select id="own" aria-label="Filtrar por estado"> <option value="all">Todas</option><option value="yes">Las tengo</option><option value="no">Me faltan</option> </select></div>
    </details>
    <details class="acc">
      <summary>Búsqueda</summary>
      <div class="accbody"><input type="search" id="q" placeholder="Buscar por nombre o número" aria-label="Buscar"></div>
    </details>
    <div class="grp g2">
      <div class="prog"><span id="ptxt">Cargando…</span><div class="track"><div class="fill" id="pfill"></div></div></div>
    </div>
    <p id="foot" class="hint"></p>
  </div>
  <div id="view"><div class="msg">Cargando…</div></div>
</div>
<button id="top" hidden aria-label="Subir al inicio" title="Subir">↑</button>
<div id="tray" hidden>
  <button id="trmin" aria-expanded="true"></button>
  <div class="trbody"><div class="tr"><div class="acts"><label><input type="radio" name="act" value="comprar"> 🛒 Quiero comprar</label><label><input type="radio" name="act" value="vender"> 💰 Quiero vender</label><label><input type="radio" name="act" value="cambiar"> 🔄 Quiero cambiar</label></div><div class="btns"><button id="go">Continuar</button><button id="clr">Limpiar selección</button></div></div>
  <p id="trerr" role="alert"></p></div>
</div>
<dialog id="stk"><h2>Sin stock</h2><p id="stkmsg"></p><div class="row"><button id="stkok" class="go">Entendido</button></div></dialog>
<dialog id="rq"><form id="rqf" method="dialog"><h2 id="rqt">Tus datos</h2>
  <label>Nombre<input id="rn" required autocomplete="name"></label>
  <label>Correo<input id="re" type="email" required autocomplete="email"></label>
  <p class="hint">Entrega presencial en Metro Universidad de Chile, en horario de oficina. Elige una fecha y la confirmamos contigo.</p>
  <label>Fecha de entrega<input id="rf" type="date" required></label>
  <label>Notas (opcional)<textarea id="rt" rows="2"></textarea></label>
  <p id="rerr" role="alert"></p>
  <div class="row"><button type="button" id="rx">Cancelar</button><button class="go" id="rs">Enviar por WhatsApp</button></div>
</form></dialog>
<script>
const SHEET_ID = "1H-xJutkK2lumjkKChyJj5Q18EW7wW-Ji6boq6GUlbHQ";   // ID de tu Google Sheet
const SHEETS = ["Set principal", "Secretas", "Classic Collection", "Energías"];
// Imágenes desde tu carpeta pública de Google Drive (images_30Aniver).
const DRIVE_FOLDER_ID = "1THRuNMTPR4wdwugrM1aZrFsk9_urnuFf";
const DRIVE_API_KEY = "AIzaSyB6Fzuf9tb_YeJJbNcPBJAc0hEtP_oOvWs";   // clave de API de Google (restringida a Drive API y a tu dominio)
let driveMap = {};          // código de carta -> ID del archivo en Drive
// Respaldo si una imagen no está en Drive:
const IMG = c => `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/30C/30C_${c}_R_EN_SM.png`;
const API = "https://script.google.com/macros/s/AKfycbxsOMIMUIm61qxNokDuDnv-TqQWAG6IspHZCgPcKRIXIUDWaXzMsK__S7iUxGWZX7Pz/exec";   // URL de la aplicación web (termina en /exec)
const PW = sessionStorage.getItem("tcg30c-admin") || "";
const ADMIN = !!PW;
const WHATSAPP = "56961717822";   // número con código de país, sin + ni espacios
const GK = "tcg30c-guest";
let picks = new Set();
try { picks = new Set(JSON.parse(localStorage.getItem(GK) || "[]")); } catch(e) {}
const savePicks = () => { try { localStorage.setItem(GK, JSON.stringify([...picks])); } catch(e) {} };
let data = {}, sheet = "";
const ALL = "Todo";
const rowsOf = n => n === ALL ? SHEETS.flatMap(x => data[x] || []) : (data[n] || []);
const $ = id => document.getElementById(id);

function csv(t){
  const out=[]; let row=[], f="", q=false;
  for (let i=0;i<t.length;i++){
    const c=t[i];
    if (q){ if (c==='"'){ if (t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===","){ row.push(f); f=""; }
    else if (c==="\n"){ row.push(f); out.push(row); row=[]; f=""; }
    else if (c!=="\r") f+=c;
  }
  if (f!==""||row.length){ row.push(f); out.push(row); }
  return out;
}
function imgFor(sheetName, r, i){
  if (sheetName==="Classic Collection") return "CC"+(i+1);
  const n=String(r["N.º"]||"");
  if (n.endsWith("/128")) return n.split("/")[0];
  if (n.endsWith("/RGB")) return n.split("/")[0];
  return "";
}
function parseSheet(name, text){
  const t = Array.isArray(text) ? text : csv(text), heads = t[0] || [];
  return t.slice(1).map((cells,i)=>{
    const o={}; heads.forEach((h,c)=>o[h]=cells[c]||"");
    o._img=imgFor(name,o,i); o._sheet=name; return o;
  }).filter(o=>Object.values(o).some(v=>v!==""));
}
const nameOf = r => r["Nombre"] || r["Carta"] || "";
const numOf  = r => r["N.º"] || r["N.º original"] || "";
const keyOf  = (s, r) => s + "|" + numOf(r) + "|" + nameOf(r);
const isOwn  = (s, r) => r["¿La tengo?"] === "Sí";

function codeFromName(name){
  let n = name.replace(/\.[^.]+$/, "").toUpperCase().replace(/^30C[_\- ]?/, "");
  let m = n.match(/^CC[_\- ]?0*(\d+)/) || n.match(/(?:^|[_\- ])CC[_\- ]?0*(\d+)/);
  if (m) return "CC" + m[1];
  m = n.match(/^([RGB])(?:[_\- ]|$)/);
  if (m) return m[1];
  m = n.match(/(?:^|[^0-9])(\d{1,3})(?:[^0-9]|$)/);
  return m ? String(m[1]).padStart(3, "0") : null;
}
async function listDrive(folderId, depth){
  let token = "", out = [];
  do{
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&key=${DRIVE_API_KEY}` + (token ? "&pageToken=" + token : "");
    const res = await fetch(url);
    if (!res.ok) throw new Error("Drive API " + res.status);
    const j = await res.json(); token = j.nextPageToken || "";
    for (const f of j.files){
      if (f.mimeType === "application/vnd.google-apps.folder"){ if (depth > 0) out = out.concat(await listDrive(f.id, depth - 1)); }
      else if (/^image\//.test(f.mimeType)) out.push(f);
    }
  } while (token);
  return out;
}
async function loadDrive(){
  if (!DRIVE_API_KEY) return;
  try{
    const files = await listDrive(DRIVE_FOLDER_ID, 2), miss = [];
    files.forEach(f => { const c = codeFromName(f.name); if (c) driveMap[c] = f.id; else miss.push(f.name); });
    console.info("Drive: " + Object.keys(driveMap).length + " imágenes reconocidas; sin reconocer:", miss);
  }catch(e){ console.warn("No pude leer la carpeta de Drive; uso Limitless como respaldo.", e); }
}
async function load(){
  try{
    let ok = false;
    try{   // 1.º: leer a través de tu Apps Script (no depende de permisos de la hoja)
      const j = await (await fetch(API + "?action=read&_=" + Date.now())).json();
      if (!j.ok) throw new Error(j.error || "Respuesta no válida");
      SHEETS.forEach(n => data[n] = parseSheet(n, j.sheets[n] || []));
      ok = true;
    }catch(e){ console.warn("Lectura por Apps Script falló; pruebo con la hoja pública.", e); }
    if (!ok){      // 2.º: respaldo, leer la hoja pública directamente
      for (const n of SHEETS){
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}&_=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Google respondió " + res.status + " al pedir la hoja «" + n + "».");
        data[n] = parseSheet(n, await res.text());
      }
    }
    await loadDrive();
    sheet = SHEETS[0];
    buildTabs(); render();
  }catch(e){
    $("view").innerHTML = '<div class="msg"><b>No pude leer tu Google Sheet.</b><br>' + e.message +
      '<br>Para que funcione, el archivo debe ser una hoja de cálculo de Google (no un .xlsx subido a Drive) y estar compartido como «Cualquier persona con el enlace: Lector». Abre la página desde GitHub Pages, no con doble clic.</div>';
    $("ptxt").textContent = "Sin datos";
  }
}
function buildTabs(){
  $("tabs").innerHTML = "";
  [ALL, ...Object.keys(data)].forEach(n => {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.textContent = n;
    b.onclick = () => { sheet = n; fillRarity(); render(); };
    $("tabs").appendChild(b);
  });
  fillRarity();
}
function fillRarity(){
  const set = [...new Set(rowsOf(sheet).map(r => r["Rareza"]).filter(Boolean))];
  $("rar").innerHTML = '<option value="">Todas las rarezas</option>' + set.map(x => `<option>${x}</option>`).join("");
  $("rar").style.display = set.length ? "" : "none";
}
function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.textContent === sheet));
  const rows = rowsOf(sheet), q = $("q").value.trim().toLowerCase(), f = $("own").value, rar = $("rar").value;
  const own = rows.filter(r => isOwn(r._sheet, r)).length;
  $("ptxt").textContent = `${sheet}: ${own} de ${rows.length} (${rows.length ? Math.round(own/rows.length*100) : 0}%)`;
  updTray();
  $("pfill").style.width = (rows.length ? own/rows.length*100 : 0) + "%";
  const list = rows.filter(r => {
    const o = isOwn(r._sheet, r);
    return (f === "all" || (f === "yes") === o) && (!rar || r["Rareza"] === rar) &&
      (!q || (nameOf(r) + " " + numOf(r)).toLowerCase().includes(q));
  });
  const g = document.createElement("div"); g.className = "grid";
  if (!list.length) g.innerHTML = '<div class="msg">Ninguna carta coincide con estos filtros.</div>';
  list.forEach(r => {
    const o = isOwn(r._sheet, r), b = document.createElement("button");
    b.className = "card" + (o ? " own" : "") + (r._saving ? " saving" : "") + (!ADMIN && picks.has(keyOf(r._sheet, r)) ? " pick" : ""); b.setAttribute("aria-pressed", o);
    b.innerHTML = `<div class="img">${r._img ? `<img loading="lazy" alt="" src="${driveMap[r._img] ? `https://drive.google.com/thumbnail?id=${driveMap[r._img]}&sz=w400` : IMG(r._img)}" data-fb="${IMG(r._img)}" onerror="if(this.dataset.fb&&!this.dataset.t){this.dataset.t=1;this.src=this.dataset.fb}else{this.replaceWith('Sin imagen')}">` : "Sin imagen"}</div>
      <b>${nameOf(r)}</b><small>${numOf(r)}</small>${r["Rareza"] ? `<span class="tag">${r["Rareza"]}</span>` : ""}`;
    b.style.cursor = "pointer"; b.onclick = () => toggle(r);
    g.appendChild(b);
  });
  $("view").replaceChildren(g);
}
["q","own","rar"].forEach(id => $(id).addEventListener("input", render));
let busy = false;
async function toggle(r){
  if (!ADMIN){            // invitado: selección local, no toca la hoja
    const k = keyOf(r._sheet, r);
    picks.has(k) ? picks.delete(k) : picks.add(k);
    savePicks(); render(); return;
  }
  if (busy) return;
  busy = true;
  const old = r["¿La tengo?"], val = old === "Sí" ? "No" : "Sí";
  r["¿La tengo?"] = val; r._saving = true; render();
  try{
    const res = await fetch(API, {method:"POST", body: JSON.stringify({action:"set", password:PW, sheet:r._sheet, num:numOf(r), name:nameOf(r), value:val})});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "Error desconocido");
  }catch(e){
    r["¿La tengo?"] = old; r._saving = false; render();
    alert("No se pudo guardar: " + e.message);
  }
  r._saving = false; busy = false; render();
}
$("role").textContent = ADMIN ? "● Perfil: Administrador" : "Perfil: Invitado";
$("role").className = "role " + (ADMIN ? "admin" : "guest");
$("foot").textContent = ADMIN
  ? "Modo admin: toca una carta para marcarla o desmarcarla. Los cambios se guardan en tu Google Sheet."
  : "Toca las cartas que quieras seleccionar. Tu selección se guarda solo en este navegador";
if (ADMIN){ $("out").hidden = false; $("out").onclick = () => { sessionStorage.removeItem("tcg30c-admin"); location.href = "index.html"; }; }
function setTrayH(){ document.documentElement.style.setProperty("--trayh", ($("tray") && !$("tray").hidden ? $("tray").offsetHeight : 0) + "px"); }
function updTray(){
  if (ADMIN) return;
  $("tray").hidden = !picks.size;
  const m = $("tray").classList.contains("min");
  $("trmin").textContent = (m ? "▴ " : "▾ ") + "Mi selección (" + picks.size + ")" + (m ? " · Mostrar" : " · Minimizar");
  $("foot").textContent = picks.size ? "" : "Toca las cartas que quieras seleccionar. Tu selección se guarda solo en este navegador";
  setTrayH();
}
if (ADMIN) $("tray").remove();
else {
  $("trmin").onclick = () => { const m = $("tray").classList.toggle("min"); $("trmin").setAttribute("aria-expanded", !m); updTray(); };
  document.querySelectorAll("input[name=act]").forEach(i => i.onchange = () => $("trerr").textContent = "");
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const chosen = () => document.querySelector("input[name=act]:checked").value;
  const picked = () => { const o = []; Object.keys(data).forEach(sn => data[sn].forEach(r => { if (picks.has(keyOf(sn, r))) o.push({sn, r}); })); return o; };
  const label = ({sn, r}) => (numOf(r) ? numOf(r) + " – " : "") + nameOf(r) + " (" + sn + ")";
  $("go").onclick = () => {
    if (!document.querySelector("input[name=act]:checked")){ $("trerr").textContent = "Debes seleccionar una acción para continuar"; return; }
    const sel = picked();
    if (!sel.length){ $("trerr").textContent = "Aún no has seleccionado cartas."; return; }
    if (chosen() === "comprar"){
      const sin = sel.filter(x => !isOwn(x.sn, x.r));
      if (sin.length){
        sin.forEach(x => picks.delete(keyOf(x.sn, x.r))); savePicks(); render();
        $("stkmsg").innerHTML = "Estas cartas no están en stock y se quitaron de tu selección:<br>• " + sin.map(label).join("<br>• ");
        $("stk").showModal(); return;
      }
    }
    $("trerr").textContent = ""; $("rerr").textContent = ""; $("rqt").textContent = "Tus datos · " + cap(chosen());
    $("rf").min = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
    $("rq").showModal();
  };
  $("stkok").onclick = () => $("stk").close();
  $("rx").onclick = () => $("rq").close();
  $("rqf").addEventListener("submit", ev => {
    ev.preventDefault();
    const lines = picked().map(x => "• " + label(x));
    if (!lines.length){ $("rerr").textContent = "No hay cartas seleccionadas."; return; }
    const f = $("rf").value.split("-").reverse().join("-");
    const n = lines.length, items = picked().map(x => "🃏 " + label(x));
    const msg = "Hola, soy " + $("rn").value.trim() + " 👋\n"
      + "Quisiera " + chosen() + (n === 1 ? " la siguiente carta:\n" : " las siguientes cartas:\n")
      + items.join("\n") + "\n"
      + "📧 Contacto: " + $("re").value.trim() + "\n"
      + "📍 Entrega propuesta: " + f + ", en Metro Universidad de Chile, en horario de oficina.\n"
      + ($("rt").value.trim() ? "📝 Notas: " + $("rt").value.trim() + "\n" : "")
      + "¿Me confirmas si te acomoda la fecha y lugar de entrega?\n¡Gracias! 😊";
    window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
    $("rq").close(); picks.clear(); savePicks(); render();
  });
  $("clr").onclick = () => { if (picks.size && confirm("¿Quitar todas las cartas seleccionadas?")){ picks.clear(); savePicks(); render(); } };
}
// Al empezar el scroll se contraen Filtros y Búsqueda; al volver arriba, Filtros se vuelve a abrir.
const accs = document.querySelectorAll(".bar details.acc");
let atTop = true;
addEventListener("scroll", () => {
  const y = scrollY;
  if (atTop && y > 60){ atTop = false; accs.forEach(d => d.open = false); }
  else if (!atTop && y <= 5){ atTop = true; accs[0].open = true; }
}, {passive:true});
// Al hacer scroll, la barra de acción se minimiza sola (se reabre desde su pestaña).
let lastY = scrollY;
addEventListener("scroll", () => {
  const y = scrollY, d = Math.abs(y - lastY); lastY = y;
  const t = $("tray");
  if (t && !ADMIN && !t.hidden && !t.classList.contains("min") && d > 8){ t.classList.add("min"); $("trmin").setAttribute("aria-expanded", "false"); updTray(); }
}, {passive:true});
const topBtn = $("top");
function chkTop(){ topBtn.hidden = !(scrollY > 300 && innerHeight + scrollY >= document.documentElement.scrollHeight - 160); setTrayH(); }
addEventListener("scroll", chkTop, {passive:true}); addEventListener("resize", chkTop);
topBtn.onclick = () => scrollTo({top:0, behavior:matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
load();
</script>
</body>
