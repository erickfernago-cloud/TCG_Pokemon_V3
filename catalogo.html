<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colección · Pokémon TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a16;--panel:#1a2038;--ink:#eef0fa;--muted:#9aa4c7;--line:#2c3457;--cobalt:#7d92ff;--gold:#ffc933;--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.5;padding:24px 20px 48px}
.wrap{max-width:980px;margin:0 auto}
a{color:inherit}
.back{display:inline-block;color:var(--cobalt);text-decoration:none;margin-bottom:14px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--cobalt)}
.num{display:inline-block;font-weight:800;font-size:1.6rem;color:#fff;padding:2px 16px;border-radius:10px;margin-bottom:8px;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.card h2{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.chip{align-self:flex-start;margin-top:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:#4fd08a;border-color:#4fd08a}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:0 0 24px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.opt h3{margin:0 0 4px;font-size:1.02rem}.opt p{margin:0;color:var(--muted);font-size:.9rem}
h2.sec{font-size:1.2rem;margin:0 0 12px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);margin-bottom:20px}
.wa{display:inline-block;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px}
</style></head><body><div class="wrap">
<a class="back" href="colecciones.html">← Colecciones</a>
<span class="num" id="n"></span>
<h1 id="t"></h1>
<p class="sub" id="d"></p>
<h2 class="sec">Opciones disponibles</h2>
<div class="opts">
  <div class="opt"><h3>🛒 Compra</h3><p>Reserva las cartas que quieres comprar.</p></div>
  <div class="opt"><h3>💰 Venta</h3><p>Ofrece las cartas que ya no necesitas.</p></div>
  <div class="opt"><h3>🔄 Cambio</h3><p>Cambia tus repetidas por las que te faltan.</p></div>
</div>
<div class="empty"><b>Catálogo en preparación</b><br>Aún no hay cartas publicadas en esta colección.</div>
<a class="wa" id="wa" href="#" target="_blank" rel="noopener">💬 Consultar por esta colección</a>
</div>
<script>
const WHATSAPP = "56961717822";
const C = {
  "02":["Colección A","Catálogo en preparación."],
  "03":["Colección B","Catálogo en preparación."],
  "04":["Colección C","Catálogo en preparación."],
  "05":["Cartas antiguas","Cartas de ediciones anteriores."],
  "06":["Cartas sin identificar","Cartas por identificar o clasificar."]
};
const BG = {"01": "linear-gradient(135deg,#e3a700,#2f4bff)", "02": "linear-gradient(135deg,#2f6bff,#1ec8ff)", "03": "linear-gradient(135deg,#1fa855,#8be37a)", "04": "linear-gradient(135deg,#8b3dff,#ff4fd8)", "05": "linear-gradient(135deg,#8a5a2b,#d9b26f)", "06": "linear-gradient(135deg,#4b5563,#9aa4c7)"};
const id = new URLSearchParams(location.search).get("c");
if (id === "01") location.replace("coleccion.html");
else if (!C[id]) location.replace("colecciones.html");
else {
  const [t,d] = C[id];
  document.title = t + " · Pokémon TCG";
  n.textContent = id; n.style.background = BG[id]; document.getElementById("t").textContent = t; document.getElementById("d").textContent = d;
  wa.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("Hola, quisiera consultar por la colección " + id + " – " + t + ".");
}
</script></body></html>
