<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colecciones · Pokémon TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a16;--panel:#1a2038;--ink:#eef0fa;--muted:#9aa4c7;--line:#2c3457;--cobalt:#7d92ff;--gold:#ffc933;--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.5;padding:24px 20px 48px}
.wrap{max-width:980px;margin:0 auto}
a{color:inherit}
.back{display:inline-block;color:var(--cobalt);text-decoration:none;margin-bottom:14px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--cobalt)}
.num{position:absolute;top:10px;left:10px;z-index:3;border:2px solid rgba(255,255,255,.85);font-weight:800;font-size:1.6rem;color:#fff;padding:2px 16px;border-radius:10px;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.card h2{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.art{position:relative;margin:-18px -18px 8px;height:190px;border-radius:13px 13px 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{height:150px;border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.art img+img{margin-left:-34px}
.art img:nth-child(1){transform:rotate(-9deg)}.art img:nth-child(2){transform:scale(1.06);z-index:2}.art img:nth-child(3){transform:rotate(9deg)}
.chip{align-self:flex-start;margin-top:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:#4fd08a;border-color:#4fd08a}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

</style></head><body><div class="wrap">
<a class="back" href="index.html">← Inicio</a>
<h1>Colecciones</h1>
<p class="sub">Elige una colección para ver su detalle y las opciones disponibles.</p>
<div class="grid" id="g"></div>
</div>
<script>
const BG = {"01": "linear-gradient(135deg,#e3a700,#2f4bff)", "02": "linear-gradient(135deg,#2f6bff,#1ec8ff)", "03": "linear-gradient(135deg,#1fa855,#8be37a)", "04": "linear-gradient(135deg,#8b3dff,#ff4fd8)", "05": "linear-gradient(135deg,#8a5a2b,#d9b26f)", "06": "linear-gradient(135deg,#4b5563,#9aa4c7)"};
const IMG = ["157","149","158"].map(i => `<img alt="" loading="lazy" src="https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/30C/30C_${i}_R_EN_SM.png" onerror="this.remove()">`).join("");
const SYM = {"02":"A","03":"B","04":"C","05":"★","06":"?"};
const svg = y => `<svg viewBox="0 0 100 140" width="100" height="140" aria-hidden="true"><rect x="4" y="4" width="92" height="132" rx="10" fill="rgba(7,10,22,.55)" stroke="#fff" stroke-opacity=".8" stroke-width="3"/><rect x="14" y="14" width="72" height="62" rx="6" fill="rgba(255,255,255,.18)"/><text x="50" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">${y}</text><rect x="14" y="88" width="50" height="6" rx="3" fill="rgba(255,255,255,.55)"/><rect x="14" y="100" width="72" height="4" rx="2" fill="rgba(255,255,255,.3)"/><rect x="14" y="110" width="60" height="4" rx="2" fill="rgba(255,255,255,.3)"/></svg>`;
const C = [
  ["01","30 Aniversario","Pokémon TCG 30th Celebration","coleccion.html",true],
  ["02","Colección A","Catálogo en preparación.","catalogo.html?c=02",false],
  ["03","Colección B","Catálogo en preparación.","catalogo.html?c=03",false],
  ["04","Colección C","Catálogo en preparación.","catalogo.html?c=04",false],
  ["05","Cartas antiguas","Cartas de ediciones anteriores.","catalogo.html?c=05",false],
  ["06","Cartas sin identificar","Cartas por identificar o clasificar.","catalogo.html?c=06",false]
];
document.getElementById("g").innerHTML = C.map(([n,t,d,h,ok]) =>
  `<a class="card" href="${h}"><div class="art" style="background:${BG[n]}">${n === "01" ? IMG : svg(SYM[n])}</div><span class="num" style="background:${BG[n]}">${n}</span><h2>${t}</h2><p>${d}</p><span class="chip${ok?" ok":""}">${ok?"Disponible":"Próximamente"}</span></a>`).join("");
</script></body></html>
